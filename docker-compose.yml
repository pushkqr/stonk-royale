services:
  stonk-royale:
    build: .
    expose:
      - "8080"
    environment:
      ALLOWED_ORIGINS: "https://*.pushkqr.app,https://pushkqr.app,https://*.stonkroyale.me,https://stonkroyale.me,http://localhost:*"
      # Unlocks /admin. Set it in a .env file beside this one, never here — with no value
      # the panel does not exist at all, which is the safe default.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      STATS_FILE: "/data/stats.json"
    volumes:
      # Lifetime counters are the only thing the app keeps. Without this they reset on
      # every redeploy, which is most days right now.
      - stonk_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - stonk-royale
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  stonk_data:
