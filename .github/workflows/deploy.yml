name: Deploy to Production

on:
  push:
    branches:
      - main
      - master

# Prevent concurrent deployments from stepping on each other
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # mvnw is committed without its executable bit (mode 100644), which has never
      # mattered because the Dockerfile calls `mvn` directly. On a Linux runner ./mvnw
      # would fail with "Permission denied".
      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy via SSH
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute remote deployment commands over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="${{ secrets.DEPLOY_PATH || '~/stonk-royale' }}"
            echo "--> Navigating to deployment directory: $TARGET_DIR"
            cd "$TARGET_DIR"

            echo "--> Fetching latest code from origin..."
            git fetch origin
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git reset --hard origin/$CURRENT_BRANCH

            echo "--> Rebuilding and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "--> Cleaning up dangling Docker images..."
            docker image prune -f

            echo "--> Deployment finished successfully!"
