spring.application.name=stonk-royale
server.port=${PORT:8080}

# No context path: the built frontend is served from the root of this same server, so the
# whole game ships as one container on one port with no CORS to configure.

# Comma-separated origin patterns allowed to reach the API and the socket.
# Lock this down to your deployed frontend URL in production.
stonk.allowed-origins=${ALLOWED_ORIGINS:*}

# No datasource by design. Matches live in memory, so the server is a single JAR with
# nothing to provision.

# Sign-in is optional. Drop a Firebase serviceAccount.json into this directory to enable
# it; without one, the game runs guest-only.
